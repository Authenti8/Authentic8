name: Guardian

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ORIGIN: https://app.ci.authenti8.example
      API_ORIGIN: https://api.ci.authenti8.example
      SUPABASE_URL: https://ci.supabase.invalid
      SUPABASE_SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify matcher fixtures
        run: npm run accuracy:fixtures
      - run: npm run guardian
      - name: Run browser and real-ledger tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
