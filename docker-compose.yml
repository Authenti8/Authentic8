services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: authenti8
      POSTGRES_PASSWORD: authenti8
      POSTGRES_USER: authenti8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authenti8 -d authenti8"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
